<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" href="/media/icon.ico">
    <link rel="stylesheet" href="/static/sideBar.css">
    <link rel="stylesheet" href="/static/globals.css">
    <link rel="stylesheet" href="/static/chat.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <input type="text" class="search" name="search" autocomplete="off">
<svg xmlns="http://www.w3.org/2000/svg" width="32px" height="32px" viewBox="0 0 512 512"><title>ionicons-v5-f</title><path d="M221.09,64A157.09,157.09,0,1,0,378.18,221.09,157.1,157.1,0,0,0,221.09,64Z" style="fill:none;stroke:#ffffff;stroke-miterlimit:10;stroke-width:32px"/><line x1="338.29" y1="338.29" x2="448" y2="448" style="fill:none;stroke:#ffffff;stroke-linecap:round;stroke-miterlimit:10;stroke-width:32px"/></svg>
        </div>
        <div class="sideBar">
            <div class="newChat">
                <svg viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg" fill="#000000"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g fill="none" fill-rule="evenodd" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" transform="translate(3 3)"> <path d="m7 1.5h-4.5c-1.1045695 0-2 .8954305-2 2v9.0003682c0 1.1045695.8954305 2 2 2h10c1.1045695 0 2-.8954305 2-2v-4.5003682"></path> <path d="m14.5.46667982c.5549155.5734054.5474396 1.48588056-.0167966 2.05011677l-6.9832034 6.98320341-3 1 1-3 6.9874295-7.04563515c.5136195-.5178979 1.3296676-.55351813 1.8848509-.1045243z"></path> <path d="m12.5 2.5.953 1"></path> </g> </g></svg>
            </div>
        </div>
        <div class="content">
            <div class="contentPreloader">
                <h4>Loading...</h4>
            </div>
        </div>
        <div class="sending">
            <input class="messageInput" autocomplete="off"></input>
            <button>SEND</button>
        </div>

        <div class="createNewChannel">
            <input type="file" accept="image/*" name="avatar" id="channelAvatar"></input>
            <input placeholder="Название канала" name="channelName" id="channelName"></input>
            <button id="createChannelButton">Создать</button>
            <img src="/media/close.svg" alt="close" class="closeCreateNewChannel">
        </div>
    </div>
    <div class="preloader">

    </div>
    <script src="/static/socket.io.min.js"></script>
    <script src="/static/chat.js" type="module"></script>
    <script src="/static/sideBar.js" type="module"></script>
    <script src="/static/header.js"></script>
</body>
</html>
